<svg xmlns="http://www.w3.org/2000/svg" width="450" height="450" viewBox="0 0 450 450">
  <title>Placeholder mockup of the Wear OS tile — replace with a real screenshot</title>
  <circle cx="225" cy="225" r="223" fill="#000000" stroke="#3a3a3a" stroke-width="4"/>

  <!-- header: direction label + swap glyph -->
  <text x="150" y="95" font-family="sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">A → B</text>
  <g transform="translate(330,85)" stroke="#8ab4f8" stroke-width="4" fill="none">
    <path d="M -14 -6 L 14 -6 M 6 -14 L 14 -6 L 6 2"/>
    <path d="M 14 8 L -14 8 M -6 0 L -14 8 L -6 16"/>
  </g>

  <!-- row 1: on time, delayed 5 min, track 4b -->
  <text x="60" y="180" font-family="sans-serif" font-size="30" fill="#ffffff">12:08</text>
  <text x="190" y="180" font-family="sans-serif" font-size="26" fill="#ff6b6b">+5</text>
  <text x="390" y="180" font-family="sans-serif" font-size="26" fill="#bbbbbb" text-anchor="end">4b</text>

  <!-- row 2: cancelled -->
  <text x="60" y="235" font-family="sans-serif" font-size="30" fill="#777777" text-decoration="line-through">12:18</text>
  <text x="390" y="235" font-family="sans-serif" font-size="22" fill="#777777" text-anchor="end">cancelled</text>

  <!-- row 3: on time, no delay -->
  <text x="60" y="290" font-family="sans-serif" font-size="30" fill="#ffffff">12:33</text>
  <text x="390" y="290" font-family="sans-serif" font-size="26" fill="#bbbbbb" text-anchor="end">3</text>

  <text x="225" y="350" font-family="sans-serif" font-size="16" fill="#666666" text-anchor="middle">mockup — not a real screenshot</text>
</svg>
